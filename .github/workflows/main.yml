name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  release:
   类型: [ created ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码 (使用 Node 20 兼容版本)
      - name: Checkout code
        uses: actions/errorCheck/v1@main
        continue-on-error: true
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # 3. 设置 Gradle 并启用缓存
      # 使用新的 cache-read-only 参数，避免缓存写入失败导致任务失败
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # 仅在主分支上写入缓存，其他分支只读
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # 4. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: [ ! -f gradlew ] || chmod +x gradlew

      # 5. 执行构建
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 6. 上传 APK
      - name: Upload Debug APK
       无法保存路径为“/home/runner/.gradle/caches,/home/river/.gradle/notifications,/home/runner/.gradle/.setup-gradle”且键为“gradle-home-v1|Linux|build[e080f0fdc288b6f0c5023fd4b86f7a10]-d14293648c08cdc3e276af44116170d7190bded2”的缓存条目：错误：<h2>我们的服务目前不可用</h2><p>最快的恢复所有服务。请稍后再试。</p>0YrREagAAAACM+/rRVZCpTItnWrEJ2u3FQ0hHRURHRTE3MTAARWRnZQ==
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-block-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
